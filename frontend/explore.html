<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Explore amazing stories on BlogSphere."
    >

    <title>Explore Stories | BlogSphere</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <header class="navbar">

        <a
            href="index.html"
            class="logo"
        >
            ✦ BlogSphere
        </a>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a
                href="explore.html"
                class="active"
            >
                Explore
            </a>

            <a href="categories.html">
                Categories
            </a>

        </nav>


        <div
            class="nav-actions"
            id="navActions"
        >

            <a
                href="login.html"
                class="login-link"
            >
                Login
            </a>

            <a
                href="register.html"
                class="btn primary"
            >
                Get Started
            </a>

        </div>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="page">

        <!-- PAGE TITLE -->

        <section class="page-title">

            <span class="eyebrow">
                DISCOVER SOMETHING NEW
            </span>

            <h1>
                Explore Stories
            </h1>

            <p>
                Discover ideas, experiences and knowledge
                shared by creators on BlogSphere.
            </p>

        </section>


        <!-- =================================================
             SEARCH + FILTER
             ================================================= -->

        <section class="toolbar">

            <input
                type="search"
                id="searchInput"
                placeholder="🔍 Search stories, topics or tags..."
                autocomplete="off"
            >


            <select
                id="categoryFilter"
            >

                <option value="">
                    All Categories
                </option>

                <option value="Technology">
                    Technology
                </option>

                <option value="AI & ML">
                    AI & ML
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="Career">
                    Career
                </option>

                <option value="College Life">
                    College Life
                </option>

                <option value="Projects">
                    Projects
                </option>

                <option value="Self Growth">
                    Self Growth
                </option>

            </select>

        </section>


        <!-- =================================================
             BLOG LIST
             ================================================= -->

        <section>

            <div
                id="blogsContainer"
                class="blog-grid"
            >

                <div class="loading">
                    Loading amazing stories...
                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

        <div>

            <b>
                ✦ BlogSphere
            </b>

            <span>
                — Where every story finds its audience.
            </span>

        </div>


        <div>
            © 2026 BlogSphere
        </div>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="script.js"
    ></script>

</body>

</html>
