<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Read and interact with BlogSphere stories."
    >

    <title>Blog | BlogSphere</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <header class="navbar">

        <a
            href="index.html"
            class="logo"
        >
            ✦ BlogSphere
        </a>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a
                href="explore.html"
                class="active"
            >
                Explore
            </a>

            <a href="categories.html">
                Categories
            </a>

        </nav>


        <div
            class="nav-actions"
            id="navActions"
        >

            <a
                href="login.html"
                class="login-link"
            >
                Login
            </a>

            <a
                href="register.html"
                class="btn primary"
            >
                Get Started
            </a>

        </div>

    </header>


    <!-- =====================================================
         BLOG CONTENT
         ===================================================== -->

    <main class="blog-page">

        <div id="blogDetails">

            <div class="empty">
                Loading story...
            </div>

        </div>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

        <div>

            <b>
                ✦ BlogSphere
            </b>

            <span>
                — Where every story finds its audience.
            </span>

        </div>


        <div>
            © 2026 BlogSphere
        </div>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="script.js"
    ></script>

</html>
